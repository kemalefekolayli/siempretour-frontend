server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400, no-transform" always;
    }

    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|avif|mp4|webm|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800, no-transform" always;
    }
}
